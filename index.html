<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelShift — Image Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div class="bg-glow"></div>

  <header>
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="3" />
        <circle cx="8.5" cy="8.5" r="1.5" />
        <path d="m21 15-5-5L5 21" />
      </svg>
      PixelShift
    </div>
  </header>

  <main>
    <div class="hero">
      <h1>Convert Any Image,<br /><span>Instantly.</span></h1>
      <p>Drop one or many images, pick a format, download — done.</p>
    </div>

    <div class="card">
      <input type="file" id="fileInput" accept="image/*" multiple />

      <!-- Empty state: full upload zone -->
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" />
            <path d="M12 12v9" />
            <path d="m16 16-4-4-4 4" />
          </svg>
        </div>
        <p class="upload-title">Drop your images here</p>
        <p class="upload-sub">or <button class="browse-link" type="button">browse files</button></p>
        <p class="upload-types">PNG · JPG · WEBP · GIF · BMP · AVIF</p>
      </div>

      <!-- Loaded state: compact add-more strip -->
      <div class="add-strip hidden" id="addStrip">
        <div class="add-strip-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15">
            <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          Add more images
        </div>
        <span id="fileCount" class="file-count"></span>
      </div>

      <!-- Image grid -->
      <div class="img-grid hidden" id="imgGrid"></div>

      <!-- Divider -->
      <div class="divider hidden" id="divider">
        <span>Convert to</span>
      </div>

      <!-- Format selector -->
      <div class="format-row hidden" id="formatRow">
        <button class="fmt active" data-fmt="image/png" data-ext="png" type="button">
          <strong>PNG</strong><em>Lossless</em>
        </button>
        <button class="fmt" data-fmt="image/jpeg" data-ext="jpg" type="button">
          <strong>JPG</strong><em>Compressed</em>
        </button>
        <button class="fmt" data-fmt="image/webp" data-ext="webp" type="button">
          <strong>WEBP</strong><em>Modern</em>
        </button>
      </div>

      <!-- Quality slider (JPG / WEBP only) -->
      <div class="quality-wrap" id="qualityWrap">
        <div class="quality-row">
          <label for="qualitySlider">Quality</label>
          <output id="qualityOut">85%</output>
        </div>
        <input type="range" id="qualitySlider" min="1" max="100" value="85" />
      </div>

      <!-- Action button -->
      <button class="btn-convert hidden" id="btnConvert" type="button">
        <svg id="convertIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        <span id="convertLabel">Convert &amp; Download</span>
      </button>
    </div>

    <div class="pills">
      <div class="pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="15" height="15">
          <rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0110 0v4" />
        </svg>
        Private — runs in your browser
      </div>
      <div class="pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="15" height="15">
          <circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" />
        </svg>
        Instant, no upload
      </div>
      <div class="pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="15" height="15">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 23 12 19.77 5.82 23 7 14.14 2 9.27l6.91-1.01L12 2z" />
        </svg>
        Free forever
      </div>
    </div>
  </main>

  <canvas id="canvas" style="display:none"></canvas>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
